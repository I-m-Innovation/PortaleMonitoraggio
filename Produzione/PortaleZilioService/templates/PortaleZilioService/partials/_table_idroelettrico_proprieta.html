<div class="table-scroll-track" data-auto-scroll="true">
<table>
    <thead>
        <tr>
            <th aria-label="Stato"></th>
            <th>Nome</th>
            <th>Potenza</th>
            <th>Portata</th>
            <th>Salto</th>
            <th>Lettura Dati</th>
            <th>Stato Contratto</th>
            <th>Dettagli</th>
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
            <tr>
                <td><span class="{{ row.status_class }}" aria-hidden="true"></span></td>
                <td><a class="impianto-detail-link" href="{% url 'PortaleZilioService:impianto-detail' %}?nome={{ row.nome|urlencode }}">{{ row.nome }}</a></td>
                <td>{{ row.potenza }}</td>
                <td>{{ row.portata }}</td>
                <td>{{ row.salto }}</td>
                <td>{{ row.lettura_dati }}</td>
                <td>{{ row.stato_contratto }}</td>
                <td><a href="{% url 'PortaleZilioService:impianto-detail' %}?nome={{ row.nome|urlencode }}">link</a></td>
            </tr>
        {% empty %}
            <tr><td colspan="8">Nessun dato disponibile.</td></tr>
        {% endfor %}
    </tbody>
</table>
</div>
